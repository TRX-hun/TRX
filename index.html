<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUA SHIELD</title>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
min-height:100vh;
background:#050507;
color:#fff;
font-family:Arial,sans-serif;
overflow-x:hidden
}

body:before{
content:"";
position:fixed;
inset:-30%;
background:
radial-gradient(circle at 50% 20%,rgba(255,0,70,.20),transparent 35%),
radial-gradient(circle at 20% 80%,rgba(120,0,255,.12),transparent 30%);
filter:blur(45px);
pointer-events:none
}

.wrap{
width:min(1050px,94%);
margin:40px auto;
position:relative
}

header{
text-align:center;
margin-bottom:25px
}

.logo{
font-size:38px;
font-weight:900;
letter-spacing:4px
}

.sub{
color:#aaa;
margin-top:8px
}

.card{
background:rgba(12,12,17,.92);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:22px;
box-shadow:0 20px 70px rgba(0,0,0,.45);
backdrop-filter:blur(15px)
}

.auth{
display:flex;
gap:10px;
margin-bottom:18px
}

input[type=password]{
width:100%;
background:#08080b;
color:#fff;
border:1px solid #292932;
border-radius:14px;
padding:14px;
outline:none
}

textarea{
width:100%;
height:330px;
resize:vertical;
background:#07070a;
color:#eee;
border:1px solid #292932;
border-radius:16px;
padding:16px;
outline:none;
direction:ltr;
text-align:left;
line-height:1.6;
font-family:Consolas,monospace
}

button{
border:0;
border-radius:14px;
padding:13px 18px;
background:linear-gradient(135deg,#ff174f,#8a00ff);
color:#fff;
font-weight:800;
cursor:pointer;
transition:.2s
}

button:hover{
transform:translateY(-2px);
filter:brightness(1.1)
}

button:disabled{
opacity:.5;
cursor:not-allowed;
transform:none
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:14px
}

.opt{
background:#09090d;
border:1px solid #24242d;
border-radius:14px;
padding:13px;
display:flex;
align-items:center;
gap:10px
}

.opt input{
accent-color:#ff174f
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px
}

.file{
border:1px dashed #34343e;
border-radius:14px;
padding:15px;
background:#09090d;
margin-top:12px
}

.file input{
width:100%;
color:#aaa
}

.status{
margin-top:15px;
padding:12px;
border-radius:12px;
background:#09090d;
color:#aaa;
min-height:44px
}

.result-box{
margin-top:15px;
display:none
}

.result-title{
margin-bottom:8px;
color:#aaa
}

pre{
margin:0;
white-space:pre-wrap;
word-break:break-word;
direction:ltr;
text-align:left;
background:#050507;
border:1px solid #292932;
border-radius:14px;
padding:15px;
max-height:400px;
overflow:auto;
font-family:Consolas,monospace
}

@media(max-width:750px){

.grid{
grid-template-columns:1fr
}

.logo{
font-size:30px
}

.auth{
flex-direction:column
}

}
</style>
</head>

<body>

<div class="wrap">

<header>

<div class="logo">
LUA SHIELD
</div>

<div class="sub">
تشويش وحماية سكربتات Lua
</div>

</header>

<div class="card">

<div class="auth">

<input
id="apiKey"
type="password"
placeholder="مفتاح API اختياري">

<button id="loginBtn">
اختبار الاتصال
</button>

</div>

<div class="grid">

<div>

<label>
كود Lua
</label>

<textarea
id="code"
placeholder="ضع سكربت Lua هنا..."></textarea>

<div class="file">

<input
id="file"
type="file"
accept=".lua,.txt">

</div>

</div>

<div>

<label>
خيارات الحماية
</label>

<div class="options">

<label class="opt">
<input id="xor" type="checkbox" checked>
XOR
</label>

<label class="opt">
<input id="base64" type="checkbox" checked>
Base64
</label>

<label class="opt">
<input id="numeric" type="checkbox" checked>
Numeric
</label>

<label class="opt">
<input id="loader" type="checkbox" checked>
Loader
</label>

</div>

<div class="actions">

<button id="obfuscate">
تشفير السكربت
</button>

<button
id="download"
style="display:none">
تحميل Lua
</button>

<button
id="copy"
style="display:none">
نسخ
</button>

</div>

<div
id="status"
class="status">
جاهز
</div>

<div
id="resultBox"
class="result-box">

<div class="result-title">
الكود الناتج
</div>

<pre id="result"></pre>

</div>

</div>

</div>

</div>

</div>

<script>

const code=document.getElementById("code");
const file=document.getElementById("file");
const apiKey=document.getElementById("apiKey");
const statusBox=document.getElementById("status");
const result=document.getElementById("result");
const resultBox=document.getElementById("resultBox");
const download=document.getElementById("download");
const copy=document.getElementById("copy");
const obfuscate=document.getElementById("obfuscate");
const loginBtn=document.getElementById("loginBtn");

let output="";

file.addEventListener("change",async()=>{

const selected=file.files[0];

if(!selected){
return;
}

try{

code.value=await selected.text();

statusBox.textContent="تم تحميل الملف بنجاح";

}catch(e){

statusBox.textContent="تعذر قراءة الملف";

}

});

loginBtn.onclick=async()=>{

loginBtn.disabled=true;
statusBox.textContent="جاري اختبار الاتصال...";

try{

const response=await fetch(
"/.netlify/functions/obfuscate",
{
method:"POST",
headers:{
"content-type":"application/json",
"x-api-key":apiKey.value
},
body:JSON.stringify({
code:"print('LUA SHIELD ONLINE')",
options:{
xor:false,
base64:false,
numeric:false,
loader:false
}
})
}
);

const data=await response.json();

if(response.ok&&data.ok){

statusBox.textContent="الاتصال بالـ API ناجح";

}else{

statusBox.textContent=data.error||"فشل الاتصال بالـ API";

}

}catch(e){

statusBox.textContent=
"تعذر الوصول إلى Netlify Function";

}

loginBtn.disabled=false;

};

obfuscate.onclick=async()=>{

const source=code.value;

if(!source.trim()){

statusBox.textContent="ضع كود Lua أولاً";
return;

}

obfuscate.disabled=true;

download.style.display="none";
copy.style.display="none";
resultBox.style.display="none";
result.textContent="";

statusBox.textContent="جاري تشفير السكربت...";

try{

const response=await fetch(
"/.netlify/functions/obfuscate",
{
method:"POST",
headers:{
"content-type":"application/json",
"x-api-key":apiKey.value
},
body:JSON.stringify({

code:source,

options:{
xor:document.getElementById("xor").checked,
base64:document.getElementById("base64").checked,
numeric:document.getElementById("numeric").checked,
loader:document.getElementById("loader").checked
}

})
}
);

let data;

try{

data=await response.json();

}catch(e){

throw new Error(
"الخادم أرسل استجابة غير صحيحة"
);

}

if(!response.ok||!data.ok){

throw new Error(
data.error||"حدث خطأ أثناء التشفير"
);

}

output=data.code||"";

if(!output){

throw new Error(
"لم يتم إنشاء الكود الناتج"
);

}

result.textContent=output;

resultBox.style.display="block";
download.style.display="inline-block";
copy.style.display="inline-block";

statusBox.textContent=
"تم التشفير بنجاح";

}catch(e){

statusBox.textContent=
e.message||"حدث خطأ أثناء التشفير";

}finally{

obfuscate.disabled=false;

}

};

copy.onclick=async()=>{

if(!output){
return;
}

try{

await navigator.clipboard.writeText(output);

statusBox.textContent="تم نسخ الكود";

}catch(e){

statusBox.textContent="تعذر نسخ الكود";

}

};

download.onclick=()=>{

if(!output){
return;
}

const blob=new Blob(
[output],
{
type:"text/plain;charset=utf-8"
}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download="protected.lua";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

};

</script>

</body>
</html>
